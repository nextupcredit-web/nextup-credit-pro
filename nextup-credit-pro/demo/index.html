<title>NextUp Credit Pro (Demo v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#EEF1F5;--panel:#FFFFFF;--panel2:#F5F7FA;--ink:#111C2B;--ink2:#54627A;--line:#DAE0E8;
  --accent:#1F4FD8;--accent-ink:#FFFFFF;--accent-soft:#E3EBFF;
  --good:#17803D;--good-soft:#DCF3E4;--warn:#9A5A00;--warn-soft:#FCEBCB;--bad:#B3261E;--bad-soft:#FADDDA;--gray-soft:#E8ECF2;
  --side:#0F1B2E;--side-ink:#C9D3E3;--side-active:#1E3050;--shadow:0 1px 2px rgba(17,28,43,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A121D;--panel:#111D2E;--panel2:#16253A;--ink:#E9EFF7;--ink2:#93A3BB;--line:#243651;
  --accent:#6E97FF;--accent-ink:#0A1530;--accent-soft:#182B57;
  --good:#5BD187;--good-soft:#123222;--warn:#F0B34F;--warn-soft:#3A2A0C;--bad:#F3877F;--bad-soft:#3D1B18;--gray-soft:#1B2A40;
  --side:#070E18;--side-ink:#A9B7CC;--side-active:#162640;--shadow:none;}}
:root[data-theme="dark"]{
  --bg:#0A121D;--panel:#111D2E;--panel2:#16253A;--ink:#E9EFF7;--ink2:#93A3BB;--line:#243651;
  --accent:#6E97FF;--accent-ink:#0A1530;--accent-soft:#182B57;
  --good:#5BD187;--good-soft:#123222;--warn:#F0B34F;--warn-soft:#3A2A0C;--bad:#F3877F;--bad-soft:#3D1B18;--gray-soft:#1B2A40;
  --side:#070E18;--side-ink:#A9B7CC;--side-active:#162640;--shadow:none;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}.sub{font-size:12.5px;color:var(--ink2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pv{position:sticky;top:0;z-index:30;background:var(--warn-soft);color:var(--warn);padding:7px 12px;font-size:12.5px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.pv button{border:1px solid currentColor;background:transparent;border-radius:999px;padding:2px 12px;font-weight:600;font-size:12px}
.pv button[aria-pressed="true"]{background:var(--warn);color:var(--warn-soft);border-color:var(--warn)}
/* site */
.site{max-width:1080px;margin:0 auto;padding:0 20px 60px}
.snav{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-size:15px}
.hero{padding:44px 0 30px;max-width:720px}
.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.1;letter-spacing:-.025em}
.hero p{font-size:17px;color:var(--ink2);margin:14px 0 0}
.paths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:26px 0}
@media (max-width:760px){.paths{grid-template-columns:1fr}}
.path{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.path h2{font-size:22px}
.path ul{margin:0;padding-left:18px;color:var(--ink2);display:grid;gap:4px}
.path .btn{align-self:flex-start;margin-top:auto}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:10px}
.how div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.how b{display:block;margin-bottom:4px}
/* app shell */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 34px)}
.side{background:var(--side);color:var(--side-ink);padding:16px 12px;display:flex;flex-direction:column;gap:3px}
.side .brand{color:#fff;padding:4px 10px 14px;font-size:16px}
.nav{display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:9px 10px;border-radius:8px;color:var(--side-ink);width:100%}
.nav:hover{background:var(--side-active)}.nav[aria-current="page"]{background:var(--side-active);color:#fff;font-weight:600}
.nav .c{margin-left:auto;font:500 11px 'IBM Plex Mono',monospace;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px}
.navh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.55;padding:12px 10px 4px}
.side .who{margin-top:auto;padding:10px;font-size:12px;border-top:1px solid #22344f}
.main{padding:24px clamp(16px,3vw,36px) 60px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:24px}.head p{margin:2px 0 0;color:var(--ink2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .k{font-size:12px;color:var(--ink2);font-weight:600}.kpi .v{font-size:27px;font-weight:700;letter-spacing:-.02em;margin-top:4px}.kpi .s{font-size:12px;color:var(--ink2)}
.kpi.good .v{color:var(--good)}
.grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
@media (max-width:1000px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.card>h3{font-size:15px;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.body{padding:14px 16px}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.card>h3+.row{border-top:0}
.row .t{font-weight:600}.grow{flex:1 1 180px;min-width:0}
.chip{display:inline-block;font-weight:600;font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--gray-soft);color:var(--ink2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn.pri:hover{filter:brightness(1.1);color:var(--accent-ink)}
.btn.sm{padding:4px 10px;font-size:12.5px}.btn.lg{padding:11px 20px;font-size:15px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:12px;color:var(--ink2);font-weight:600;padding:9px 16px;background:var(--panel2);white-space:nowrap}
td{padding:11px 16px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.bar{height:8px;border-radius:99px;background:var(--gray-soft);overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--good)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{background:none;border:0;padding:9px 14px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:820px){.two,.three{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;padding:8px}.side .who,.side .brand,.navh{display:none}.nav{width:auto;white-space:nowrap}}
.lbl{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px;display:block}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit}
textarea.f{min-height:110px;resize:vertical;line-height:1.55}
.drop{border:2px dashed var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--ink2);background:var(--panel2)}
.scores{display:flex;gap:10px;flex-wrap:wrap}.score{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel);min-width:110px}
.score .b{font-size:11.5px;color:var(--ink2);font-weight:600}.score .n{font-size:24px;font-weight:700}
.note{border-radius:8px;padding:10px 12px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.note.info{background:var(--accent-soft);color:var(--accent)}.note.good{background:var(--good-soft);color:var(--good)}
.item{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:10px;padding:14px 16px;display:grid;gap:10px}
.item.ig{opacity:.75;background:var(--panel2)}
.item .top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 14px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button.ig[aria-pressed="true"]{background:var(--ink2);color:var(--panel)}
.factors{display:grid;gap:8px}.factors .r{display:grid;grid-template-columns:150px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px}
.factors .bar{height:10px}.factors .bar i{background:var(--accent)}
.letter{white-space:pre-wrap;line-height:1.65;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px}
.steps{display:grid;gap:0}
.stp{display:flex;gap:14px;padding:14px 16px;border-top:1px solid var(--line);align-items:flex-start}
.stp:first-child{border-top:0}
.stp b.n{width:28px;height:28px;border-radius:50%;background:var(--gray-soft);display:grid;place-items:center;flex:none;font-size:13px;color:var(--ink2)}
.stp.done b.n{background:var(--good);color:#fff}.stp.now{background:var(--accent-soft)}.stp.now b.n{background:var(--accent);color:var(--accent-ink)}
.rounds{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.rounds div{padding:8px 4px;text-align:center;border-radius:8px;background:var(--gray-soft);font-weight:700;font-size:12.5px;color:var(--ink2)}
.rounds div.d{background:var(--good-soft);color:var(--good)}.rounds div.n{background:var(--accent);color:var(--accent-ink)}
.overlay{position:fixed;inset:0;background:rgba(8,14,24,.55);display:grid;place-items:center;padding:16px;z-index:40}
.modal{background:var(--panel);border-radius:14px;max-width:680px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:20px}
.modal h2{margin-bottom:6px}
.paper{background:#fff;color:#111;font:15px/1.6 'Times New Roman',Times,serif;border:1px solid var(--line);border-radius:6px;padding:34px 38px;box-shadow:0 6px 24px rgba(0,0,0,.12);max-width:720px;margin:0 auto}
.paper p{margin:0 0 14px}.paper .blk{margin-bottom:18px;white-space:pre-line}.paper ol{margin:0 0 14px;padding-left:26px}
.paper .sig{margin-top:26px;min-height:54px}.paper .sigline{border-bottom:1px solid #111;width:280px;height:34px}
.paper .esig{font:italic 30px 'Brush Script MT','Segoe Script',cursive;line-height:1.1}
.paper .cap{font:11px 'Public Sans',sans-serif;color:#666;margin-top:14px}
.copy{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 12px;flex-wrap:wrap}
.copy code{flex:1;min-width:200px;font-family:'IBM Plex Mono',monospace;font-size:13px;word-break:break-all}
.join{max-width:640px;margin:0 auto;padding:24px 16px 60px}
.price{font-size:34px;font-weight:800;letter-spacing:-.02em}.price span{font-size:15px;font-weight:600;color:var(--ink2)}
.two-c{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px;align-items:start}@media (max-width:820px){.two-c{grid-template-columns:1fr}}
.pages{display:grid;gap:8px;margin:12px 0}.pg{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--panel2)}
.pg i{width:30px;height:38px;border:1px solid var(--line);background:var(--panel);border-radius:3px;flex:none}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(215px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h4{margin:0;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;color:var(--ink2)}
.kc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left;display:grid;gap:4px}
.kc:hover{border-color:var(--accent)}
.kc .n{font-weight:700}.kc .m{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--ink2)}
.kc .td{font-size:12px;color:var(--warn)}
.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:10.5px;font-weight:700}
.thread{display:grid;gap:8px;padding:14px;max-height:380px;overflow:auto}
.bub{max-width:80%;padding:9px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.bub.me{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bub .w{font-size:11px;opacity:.7;margin-top:2px}
.legend{display:grid;gap:8px}.legend div{display:flex;gap:8px;align-items:center}.legend i{width:12px;height:12px;border-radius:3px}
.sbar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--gray-soft)}
.ls{margin-top:56px}
.ls>h2{font-size:clamp(22px,3vw,30px);letter-spacing:-.02em;margin-bottom:8px}
.ls>.lead{color:var(--ink2);max-width:680px;margin:0 0 22px;font-size:15.5px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.feat>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.feat b{display:block;margin-bottom:4px}
.feat span{color:var(--ink2);font-size:13.5px}
.stepsx{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;counter-reset:s}
.stepsx>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative}
.stepsx>div b.n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);margin-bottom:8px;font-size:13px}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tier{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px}
.tier.hot{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tier ul{margin:0;padding-left:18px;color:var(--ink2);display:grid;gap:4px;font-size:13.5px}
.tier .btn{margin-top:auto}
.faq details{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:0 16px}
.faq summary{cursor:pointer;padding:14px 0;font-weight:600}
.faq p{margin:0 0 14px;color:var(--ink2)}
.cta{background:var(--side);color:#fff;border-radius:16px;padding:34px 24px;text-align:center;margin-top:56px}
.cta h2{color:#fff;font-size:26px;margin-bottom:8px}.cta p{color:#C9D3E3;margin:0 0 18px}
.cta .btn{margin:4px}
.two-l{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}@media (max-width:760px){.two-l{grid-template-columns:1fr}}
.tog{display:flex;gap:10px;flex-wrap:wrap}
.tog label{flex:1;min-width:210px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--panel)}
.tog label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.tog input{margin-right:8px}
.cta .btn:not(.pri){background:#fff;color:#111C2B;border-color:#fff}.cta .btn:not(.pri):hover{color:#1F4FD8}
.agr{border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:16px 18px;max-height:340px;overflow:auto;line-height:1.6;font-size:13.5px}.agr h4{margin:18px 0 6px;font-size:14.5px}.agr p{margin:0 0 8px}.agr p.ind{padding-left:14px}.agh{padding-bottom:10px;border-bottom:1px solid var(--line)}
.brand svg{flex:none}.wm{display:grid;line-height:1.05;font-weight:800;letter-spacing:-.01em}.wm small{font-size:9.5px;letter-spacing:.24em;font-weight:700;opacity:.65;margin-top:2px}

.wm{white-space:nowrap}
#toast{pointer-events:none;position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(–ink);color:var(–panel);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13.5px;z-index:60;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
@media (min-width:821px){.only-m{display:none!important}}
@media (max-width:820px){
.pv{position:static;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:7px 12px;-webkit-overflow-scrolling:touch}
.pv>span{display:none}.pv button{white-space:nowrap;flex:none}
.side{position:sticky;top:0;z-index:20}
.shell{min-height:0}
.snav{flex-wrap:wrap;gap:10px}
.snav>div:last-child{width:100%;overflow-x:auto;flex-wrap:nowrap!important;padding-bottom:4px}
.snav .btn{white-space:nowrap;flex:none}
.hero{padding:24px 0 18px}
input.f,select.f,textarea.f{font-size:16px}
.btn{min-height:42px}.btn.sm{min-height:38px;padding:6px 12px}
.paper{padding:20px 18px;font-size:14px}
.modal{padding:16px}
.head h1{font-size:22px}
.main{padding-top:16px}
.factors .r{grid-template-columns:110px minmax(0,1fr) 40px}
.only-d{display:none!important}
.ls{margin-top:40px}
.price{font-size:30px}.price span{display:block;font-size:13px;margin-top:2px}
.row{padding:12px}
.thread{max-height:320px}
.agr{max-height:300px}
}

/* ===== v2 additions ===== */
.calwrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}
@media (max-width:900px){.calwrap{grid-template-columns:1fr}}
.wk{display:grid;grid-template-columns:48px repeat(5,minmax(0,1fr));font-size:12px;min-width:540px}
.wk .h{padding:8px 4px;text-align:center;font-weight:700;background:var(–panel2);border-bottom:1px solid var(–line);border-left:1px solid var(–line)}
.wk .h:first-child{border-left:0}
.wk .t{padding:0 6px;color:var(–ink2);text-align:right;font-family:‘IBM Plex Mono’,monospace;font-size:11px;height:50px;border-top:1px solid var(–line)}
.wk .c{border-top:1px solid var(–line);border-left:1px solid var(–line);height:50px;padding:2px}
.evb{width:100%;height:100%;border:0;border-left:4px solid var(–accent);background:var(–accent-soft);border-radius:6px;padding:3px 6px;text-align:left;font-size:11.5px;line-height:1.25;overflow:hidden}
.evb b{display:block;font-size:12px}
.evb.g{border-color:var(–good);background:var(–good-soft)}
.evb.w{border-color:var(–warn);background:var(–warn-soft)}
.evb.k{border-color:#8B97AB;background:var(–gray-soft);color:var(–ink2)}
.codebox{background:#0F1B2E;color:#C9D3E3;border-radius:8px;padding:10px 12px;font-family:‘IBM Plex Mono’,monospace;font-size:11.5px;overflow-x:auto;white-space:nowrap}
.bkpage{border:1px solid var(–line);border-radius:12px;overflow:hidden;background:var(–panel);max-width:760px}
.bkh{background:var(–bk,var(–accent));color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
