<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>NextUp Credit Pro - Live app setup</title><link rel="icon" href="../icons/logo.svg"><link rel="manifest" href="../manifest.webmanifest">
<style>body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#F5F7FB;color:#111C2B;padding:20px}.c{max-width:560px;margin:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 6px 30px #1f4fd81a}li{margin:8px 0}.ok{color:#0a7d3c}.no{color:#b42318}code{background:#eef2fa;padding:1px 5px;border-radius:5px}</style></head><body><div class="c"><h1>Live app setup check</h1><p>The live app is not connected yet. This page shows what is still missing.</p><ul id="l"></ul><p><a href="../demo/">Open the demo instead</a></p></div>
<script src="../config.js"></script><script>
var c=window.NCP||{},L=document.getElementById('l');
function row(ok,t){L.insertAdjacentHTML('beforeend','<li class="'+(ok?'ok':'no')+'">'+(ok?'Done: ':'Missing: ')+t+'</li>');}
row(!!c.SUPABASE_URL,'Supabase project address in <code>config.js</code>');
row(!!c.SUPABASE_ANON_KEY,'Supabase public (anon) key in <code>config.js</code>');
if(c.SUPABASE_URL&&c.SUPABASE_ANON_KEY){fetch(c.SUPABASE_URL+'/auth/v1/settings',{headers:{apikey:c.SUPABASE_ANON_KEY}}).then(function(r){row(r.ok,'Supabase reachable')}).catch(function(){row(false,'Supabase reachable')});}
</script></body></html>
